<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Les Nanous</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Les Nanous">
<meta name="theme-color" content="#f6e7d6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#221814" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Mise en page : une seule page — en-tête chaleureux, résumé, puis la grille de toutes les tâches triées par urgence ; une fiche glisse du bas pour noter une date. */
:root{
  --bg:#f6e7d6;          /* lin chaud */
  --bg-2:#efdac4;
  --card:#fff8f0;
  --ink:#3d2a22;         /* cacao */
  --muted:#8a6f60;
  --line:#e8d3bd;
  --honey:#e9a23b;       /* miel */
  --apricot:#df6f45;     /* abricot / en retard */
  --sage:#7d9a68;        /* sauge / tout va bien */
  --sage-soft:#e3ead8;
  --honey-soft:#fbe7c4;
  --apricot-soft:#f8d8c8;
  --idle-soft:#efe4d8;
  --on-accent:#fffaf3;
  --shadow:0 1px 0 rgba(61,42,34,.04),0 6px 18px -8px rgba(122,63,44,.25);
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,-apple-system,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#221814;--bg-2:#2b1f1a;--card:#33251f;--ink:#f7e9dc;--muted:#bfa392;--line:#47342b;
    --honey:#f0b04f;--apricot:#ef8459;--sage:#9cb886;
    --sage-soft:#36382a;--honey-soft:#45351f;--apricot-soft:#4a2a20;--idle-soft:#3b2c25;
    --on-accent:#2a1a12;--shadow:0 6px 18px -10px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--honey);outline-offset:2px}

.wrap{max-width:860px;margin:0 auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}

/* En-tête */
.top{display:flex;align-items:center;gap:12px}
.top img{width:46px;height:46px;border-radius:13px;box-shadow:var(--shadow)}
.top h1{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;margin:0;letter-spacing:-.01em}
.top p{margin:3px 0 0;color:var(--muted);font-size:13px;font-weight:600}
.top .grow{flex:1;min-width:0}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:17px}

/* Résumé */
.summary{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-weight:700;font-size:13px;background:var(--card);border:1px solid var(--line)}
.chip i{width:9px;height:9px;border-radius:50%;display:block}
.chip.late i{background:var(--apricot)} .chip.soon i{background:var(--honey)} .chip.ok i{background:var(--sage)} .chip.idle i{background:var(--muted)}

/* Bandeau notifications */
.notice{background:var(--honey-soft);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:600;line-height:1.35}
.notice .grow{flex:1;min-width:0}
.notice button{border:0;border-radius:11px;padding:9px 13px;background:var(--ink);color:var(--bg);font-weight:800;font-size:13px;white-space:nowrap}

/* Sections & grille */
.section{display:flex;flex-direction:column;gap:10px}
.section h2{font-family:var(--display);font-weight:500;font-size:17px;margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:820px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px 12px 11px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-height:132px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .row{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.emo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--idle-soft);flex:none}
.pill{font-size:11.5px;font-weight:800;padding:4px 8px;border-radius:999px;white-space:nowrap;background:var(--idle-soft);color:var(--muted)}
.tile .name{font-weight:800;font-size:14.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.bar{height:6px;border-radius:99px;background:var(--idle-soft);overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;background:var(--muted)}
.tile .last{font-size:12px;color:var(--muted);font-weight:600}

.tile.ok .emo{background:var(--sage-soft)} .tile.ok .pill{background:var(--sage-soft);color:var(--sage)} .tile.ok .bar span{background:var(--sage)}
.tile.soon .emo{background:var(--honey-soft)} .tile.soon .pill{background:var(--honey-soft);color:#b0701a} .tile.soon .bar span{background:var(--honey)}
.tile.late .emo{background:var(--apricot-soft)} .tile.late .pill{background:var(--apricot);color:var(--on-accent)} .tile.late .bar span{background:var(--apricot)}
.tile.late{border-color:color-mix(in srgb,var(--apricot) 45%,var(--line))}
@media (prefers-color-scheme:dark){.tile.soon .pill{color:var(--honey)}}

.add{border:2px dashed var(--line);background:transparent;border-radius:18px;min-height:132px;color:var(--muted);font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.add b{font-size:26px;font-family:var(--display);font-weight:500;line-height:1}

.mode{font-size:12px;color:var(--muted);text-align:center;font-weight:600;margin:0}

/* Fiche (bottom sheet) */
.scrim{position:fixed;inset:0;background:rgba(40,22,14,.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px -10px rgba(40,22,14,.35)}
.sheet.open{transform:none}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 2px}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-head .emo{width:52px;height:52px;font-size:28px;border-radius:16px}
.sh-head h3{font-family:var(--display);font-weight:600;font-size:22px;margin:0;line-height:1.1}
.sh-head p{margin:3px 0 0;color:var(--muted);font-weight:700;font-size:13px}
.close{margin-left:auto;align-self:flex-start}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.fact small{display:block;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.fact b{font-size:15px}
.primary{border:0;border-radius:16px;padding:16px;background:var(--apricot);color:var(--on-accent);font-weight:800;font-size:16px;box-shadow:0 8px 20px -10px var(--apricot)}
.primary:active{transform:scale(.98)}
.other{display:flex;gap:8px;align-items:center}
.other label{font-weight:700;font-size:14px;flex:none}
input[type=date],input[type=text],input[type=number],input[type=email],input[type=password]{min-width:0;flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-weight:700;font-size:16px}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:800;white-space:nowrap}
.block h4{margin:0 0 8px;font-family:var(--display);font-weight:500;font-size:16px;color:var(--muted)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.hist li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.hist li:first-child{border-top:0}
.hist li span{flex:1}
.hist li em{font-style:normal;color:var(--muted);font-size:12.5px;font-weight:600}
.hist .del{border:0;background:transparent;color:var(--muted);font-weight:800;padding:4px 8px;border-radius:8px}
.hist .del.confirm{background:var(--apricot);color:var(--on-accent)}
.empty{color:var(--muted);font-weight:600;font-size:13.5px;margin:0}
details{border:1px solid var(--line);border-radius:14px;background:var(--card)}
summary{padding:12px 14px;font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--muted)}
details[open] summary::after{content:"－"}
.form{display:flex;flex-direction:column;gap:12px;padding:0 14px 14px}
.form.bare{padding:0}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-weight:700;font-size:13px;color:var(--muted)}
.inline{display:flex;gap:8px;align-items:center}
.inline input{width:70px;flex:none}
.inline span{font-weight:700}
.preview{background:var(--honey-soft);border-radius:12px;padding:10px 12px;font-weight:700;font-size:13.5px;line-height:1.35}
.preview small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.danger{border:0;background:transparent;color:var(--apricot);font-weight:800;padding:8px 0;text-align:left}
.danger.confirm{background:var(--apricot);color:var(--on-accent);padding:10px 14px;border-radius:12px}

/* Connexion */
.login{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
.login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
.login img{width:96px;height:96px;border-radius:26px;margin:0 auto 6px;box-shadow:var(--shadow)}
.login h1{font-family:var(--display);font-weight:600;margin:0;font-size:30px}
.login p{margin:0 0 6px;color:var(--muted);font-weight:600}
.login input{width:100%}
.err{color:var(--apricot);font-weight:700;font-size:13.5px;min-height:1em}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,30px);opacity:0;z-index:40;background:var(--ink);color:var(--bg);font-weight:800;padding:11px 16px;border-radius:14px;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="icons/icon-180.png" alt="">
    <div class="grow">
      <h1>Les Nanous</h1>
      <p id="today"></p>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Actualiser">↻</button>
  </header>

  <div class="summary" id="summary"></div>
  <div id="notice"></div>
  <main id="board"></main>
  <p class="mode" id="mode"></p>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-in" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<div class="login" id="login" hidden>
  <form id="loginForm">
    <img src="icons/icon-180.png" alt="">
    <h1>Les Nanous</h1>
    <p>Connectez-vous une fois, l'appli s'en souviendra.</p>
    <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username" required>
    <input type="password" id="loginPass" placeholder="Mot de passe" autocomplete="current-password" required>
    <button class="primary" type="submit">Entrer</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<script src="vendor/supabase.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>

name: Rappels ménage

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = envoyer une notif de test maintenant"
        type: choice
        options: [normal, test]
        default: test

permissions:
  contents: read
  actions: write

jobs:
  rappels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/rappels.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          MODE: ${{ github.event.inputs.mode }}
      - name: Garder les rappels actifs
        if: always()
        run: gh workflow enable rappels.yml || true
        env:
          GH_TOKEN: ${{ github.token }}
